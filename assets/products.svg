<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-label="Six product areas: eComGear, IDPicker, Mirofish, OneNET, BuildWeaver, and OneMail">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101010"/><stop offset=".55" stop-color="#1b1b1b"/><stop offset="1" stop-color="#181818"/></linearGradient>
  <linearGradient id="aqua" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ffa116"/><stop offset="1" stop-color="#f0ad4e"/></linearGradient>
  <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ffa116"/><stop offset="1" stop-color="#f0ad4e"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#404040" stroke-opacity=".25"/></pattern>
</defs>
<rect width="1200" height="780" rx="24" fill="url(#bg)"/>
<rect width="1200" height="780" rx="24" fill="url(#grid)"/>
<text x="46" y="53" fill="#f0f0f0" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="750">Systems I've worked on</text>
<text x="46" y="79" fill="#a8a8a8" font-family="Consolas, monospace" font-size="15">PRODUCT STORIES / WEB · AI · SIMULATION · MOBILE</text>
<g transform="translate(46 110)">
      <rect width="532" height="192" rx="18" fill="#202020" stroke="#404040"/>
      <rect width="6" height="192" rx="3" fill="#ffa116"/>
      <text x="30" y="44" fill="#ffa116" font-family="Consolas, monospace" font-size="17">01 / REACT · TYPESCRIPT · NODE.JS</text>
      <text x="30" y="91" fill="#f0f0f0" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="750">eComGear</text>
      <text x="30" y="119" fill="#ffa116" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">AI website builder</text>
      <text x="30" y="151" fill="#dcdcdc" font-family="Segoe UI, Arial, sans-serif" font-size="16">Describe a site or app, watch it build live,</text>
      <text x="30" y="174" fill="#dcdcdc" font-family="Segoe UI, Arial, sans-serif" font-size="16">then refine and publish the result.</text>
    </g><g transform="translate(608 110)">
      <rect width="532" height="192" rx="18" fill="#202020" stroke="#404040"/>
      <rect width="6" height="192" rx="3" fill="#5cb85c"/>
      <text x="30" y="44" fill="#5cb85c" font-family="Consolas, monospace" font-size="17">02 / NEXT.JS · DJANGO · GEMINI</text>
      <text x="30" y="91" fill="#f0f0f0" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="750">IDPicker</text>
      <text x="30" y="119" fill="#5cb85c" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Education and career guidance</text>
      <text x="30" y="151" fill="#dcdcdc" font-family="Segoe UI, Arial, sans-serif" font-size="16">Turn assessments into personalized study</text>
      <text x="30" y="174" fill="#dcdcdc" font-family="Segoe UI, Arial, sans-serif" font-size="16">and career options for students and advisors.</text>
    </g><g transform="translate(46 330)">
      <rect width="532" height="192" rx="18" fill="#202020" stroke="#404040"/>
      <rect width="6" height="192" rx="3" fill="#f0ad4e"/>
      <text x="30" y="44" fill="#f0ad4e" font-family="Consolas, monospace" font-size="17">03 / REACT · EXPRESS · POSTGRESQL</text>
      <text x="30" y="91" fill="#f0f0f0" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="750">Mirofish</text>
      <text x="30" y="119" fill="#f0ad4e" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Prediction and simulation</text>
      <text x="30" y="151" fill="#dcdcdc" font-family="Segoe UI, Arial, sans-serif" font-size="16">Upload source material, run multi-agent</text>
      <text x="30" y="174" fill="#dcdcdc" font-family="Segoe UI, Arial, sans-serif" font-size="16">simulations, examine reports and replays.</text>
    </g><g transform="translate(608 330)">
      <rect width="532" height="192" rx="18" fill="#202020" stroke="#404040"/>
      <rect width="6" height="192" rx="3" fill="#d9534f"/>
      <text x="30" y="44" fill="#d9534f" font-family="Consolas, monospace" font-size="17">04 / FLUTTER · DART · SING-BOX</text>
      <text x="30" y="91" fill="#f0f0f0" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="750">OneNET</text>
      <text x="30" y="119" fill="#d9534f" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Cross-platform connectivity</text>
      <text x="30" y="151" fill="#dcdcdc" font-family="Segoe UI, Arial, sans-serif" font-size="16">Import connection profiles and use multiple</text>
      <text x="30" y="174" fill="#dcdcdc" font-family="Segoe UI, Arial, sans-serif" font-size="16">proxy protocols across desktop and mobile.</text>
    </g><g transform="translate(46 550)">
      <rect width="532" height="192" rx="18" fill="#202020" stroke="#404040"/>
      <rect width="6" height="192" rx="3" fill="#ffa116"/>
      <text x="30" y="44" fill="#ffa116" font-family="Consolas, monospace" font-size="17">05 / REACT · NESTJS · POSTGRESQL</text>
      <text x="30" y="91" fill="#f0f0f0" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="750">BuildWeaver</text>
      <text x="30" y="119" fill="#ffa116" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Visual application builder</text>
      <text x="30" y="151" fill="#dcdcdc" font-family="Segoe UI, Arial, sans-serif" font-size="16">Design interfaces visually and generate code</text>
      <text x="30" y="174" fill="#dcdcdc" font-family="Segoe UI, Arial, sans-serif" font-size="16">for full-stack applications.</text>
    </g><g transform="translate(608 550)">
      <rect width="532" height="192" rx="18" fill="#202020" stroke="#404040"/>
      <rect width="6" height="192" rx="3" fill="#5cb85c"/>
      <text x="30" y="44" fill="#5cb85c" font-family="Consolas, monospace" font-size="17">06 / TYPESCRIPT · POSTGRESQL · REDIS</text>
      <text x="30" y="91" fill="#f0f0f0" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="750">OneMail</text>
      <text x="30" y="119" fill="#5cb85c" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Email agent with human review</text>
      <text x="30" y="151" fill="#dcdcdc" font-family="Segoe UI, Arial, sans-serif" font-size="16">Connect mailboxes, generate grounded drafts,</text>
      <text x="30" y="174" fill="#dcdcdc" font-family="Segoe UI, Arial, sans-serif" font-size="16">review and approve each send.</text>
    </g>
</svg>
